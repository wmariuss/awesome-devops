name: Links validator

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 09:00 UTC.
    - cron: "0 9 * * 1"
  # Also after the list changes, so the badge reflects the current README.
  push:
    branches: [main]
    paths: [README.md, CONTRIBUTING.md]

concurrency:
  group: links-validator
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  link_checker:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress --timeout 30 --max-retries 3 --retry-wait-time 10 --max-concurrency 4
            --accept 200,206,403,429
            README.md CONTRIBUTING.md
          output: ./lychee/out.md
          fail: false

      # One open issue tracks broken links: updated while links fail, closed when they pass.
      - name: Report broken links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          set -euo pipefail
          title="Broken links report"
          existing=$(gh issue list --state open --label "links validator" --search "in:title $title" --json number --jq '.[0].number // empty')
          if [ "$EXIT_CODE" != "0" ]; then
            gh label create "links validator" --color d49a1f --description "Broken links found by the weekly check" 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file ./lychee/out.md
              gh issue comment "$existing" --body "Still failing on $(date -u +%Y-%m-%d). The report above is updated."
            else
              gh issue create --title "$title" --label "links validator" --body-file ./lychee/out.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All links pass as of $(date -u +%Y-%m-%d)."
          fi

      # Fail the run while links are broken, so the README badge shows it. The issue
      # above lists which links to fix.
      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "::error::Broken links found. See the \"Broken links report\" issue."
          exit 1
