name: Links validator

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 09:00 UTC.
    - cron: "0 9 * * 1"
  # Also after the list changes, so the badge reflects the current README.
  push:
    branches: [main]
    paths: [README.md, CONTRIBUTING.md]

concurrency:
  group: links-validator
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link_checker:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress --timeout 30 --max-retries 3 --retry-wait-time 10 --max-concurrency 4
            --accept 200..=299,403,406,429
            README.md CONTRIBUTING.md
          # Broken links are listed on the run's summary page; no issue is opened.
          jobSummary: true
          fail: false

      # Fail the run while links are broken, so the README badge shows it.
      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "::error::Broken links found. They are listed in this run's summary."
          exit 1
